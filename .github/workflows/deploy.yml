name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'agentify-erp/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/agentify-erp
  SERVICE: agentify-erp

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentify-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentify-erp/client/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: agentify-erp/client/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: agentify-erp/client/dist

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD || secrets.SECRETKEY }}
          HOST: ${{ secrets.SSH_HOST || secrets.ACCESSKEY }}
          DUSER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          ENV_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENV_ERP_SECRETS_KEY: ${{ secrets.ERP_SECRETS_KEY }}
          ENV_ERP_BASE_DOMAIN: ${{ secrets.ERP_BASE_DOMAIN }}
          ENV_PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          ENV_PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${SSHPASS:-}" ]; then
            echo "Missing required secrets: SSH_HOST and SSH_PASSWORD"; exit 1
          fi
          PORT="${PORT:-22}"
          DUSER="${DUSER:-root}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o ServerAliveInterval=20"
          JWT_SECRET="${ENV_JWT_SECRET:-$(openssl rand -hex 32)}"
          ERP_SECRETS_KEY="${ENV_ERP_SECRETS_KEY:-$(openssl rand -hex 32)}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${ERP_SECRETS_KEY}"
          if [ -n "${ENV_PLATFORM_ADMIN_PASSWORD:-}" ]; then echo "::add-mask::${ENV_PLATFORM_ADMIN_PASSWORD}"; fi
          REMOTE="$DUSER@$HOST"

          q() { printf '%q' "$1"; }
          REMOTE_ENV="JWT_SECRET=$(q "$JWT_SECRET")"
          REMOTE_ENV="$REMOTE_ENV ERP_SECRETS_KEY=$(q "$ERP_SECRETS_KEY")"
          REMOTE_ENV="$REMOTE_ENV ERP_BASE_DOMAIN=$(q "${ENV_ERP_BASE_DOMAIN:-}")"
          REMOTE_ENV="$REMOTE_ENV PLATFORM_ADMIN_EMAIL=$(q "${ENV_PLATFORM_ADMIN_EMAIL:-}")"
          REMOTE_ENV="$REMOTE_ENV PLATFORM_ADMIN_PASSWORD=$(q "${ENV_PLATFORM_ADMIN_PASSWORD:-}")"

          echo "==> Bootstrapping server ($HOST)"
          sshpass -e $SSH -p "$PORT" "$REMOTE" \
            "$REMOTE_ENV bash -s" \
            -- "$APP_DIR" "$SERVICE" < .github/scripts/remote-bootstrap.sh

          echo "==> Uploading server code"
          sshpass -e rsync -az --delete -e "$SSH -p $PORT" \
            --exclude 'node_modules' --exclude '.env' --exclude '.env.*' \
            --exclude 'data' --exclude 'uploads' \
            agentify-erp/server/ "$REMOTE:$APP_DIR/server/"

          echo "==> Uploading built client"
          sshpass -e rsync -az --delete -e "$SSH -p $PORT" \
            agentify-erp/client/dist/ "$REMOTE:$APP_DIR/client/dist/"

          echo "==> Installing and restarting"
          sshpass -e $SSH -p "$PORT" "$REMOTE" "bash -s" \
            -- "$APP_DIR" "$SERVICE" < .github/scripts/remote-release.sh

          echo "Deployed: http://$HOST:4000"
