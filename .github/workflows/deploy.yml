name: Deploy

on:
  push:
    branches: [main]
    paths: ['agentify-erp/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/agentify-erp
  SERVICE: agentify-erp

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentify-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agentify-erp/server/package-lock.json
            agentify-erp/client/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server test
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: agentify-erp/client/dist
          retention-days: 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: agentify-erp/client/dist

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
          EOF

      # Live data (databases, uploads) and .env stay on the server; never overwritten.
      - name: Upload code
        run: |
          ssh server "mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude 'node_modules' --exclude '.env' --exclude '.env.*' \
            --exclude 'server/data' --exclude 'server/uploads' \
            --exclude 'mobile' --exclude 'docs' --exclude '.github' \
            agentify-erp/ server:$APP_DIR/

      - name: Install dependencies and restart
        run: |
          ssh server "set -e
            cd $APP_DIR
            npm --prefix server ci --omit=dev
            systemctl restart $SERVICE
            sleep 3
            systemctl is-active $SERVICE"
