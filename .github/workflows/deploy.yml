name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'agentify-erp/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Deploy without running the server tests first
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/agentify-erp
  SERVICE: agentify-erp

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentify-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentify-erp/client/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: agentify-erp/client/dist
          retention-days: 1

  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentify-erp/server/package-lock.json
      - run: npm --prefix agentify-erp/server ci
      - run: npm --prefix agentify-erp/server test

  deploy:
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: agentify-erp/client/dist

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD || secrets.SECRETKEY }}
          HOST: ${{ secrets.SSH_HOST || secrets.ACCESSKEY }}
          DUSER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          ENV_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENV_ERP_SECRETS_KEY: ${{ secrets.ERP_SECRETS_KEY }}
          ENV_ERP_BASE_DOMAIN: ${{ secrets.ERP_BASE_DOMAIN }}
          ENV_PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          ENV_PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${SSHPASS:-}" ]; then
            echo "Missing required secrets: SSH_HOST and SSH_PASSWORD"; exit 1
          fi
          HOST="$(printf '%s' "${HOST:-}" | tr -d '[:space:]')"   # a pasted secret often carries a trailing space or newline
          PORT="$(printf '%s' "${PORT:-22}" | tr -d '[:space:]')"
          DUSER="${DUSER:-root}"
          DOMAIN="${SERVER_DOMAIN:-agentifyerp.biztrack.uk}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o ServerAliveInterval=20"
          JWT_SECRET="${ENV_JWT_SECRET:-$(openssl rand -hex 32)}"
          ERP_SECRETS_KEY="${ENV_ERP_SECRETS_KEY:-$(openssl rand -hex 32)}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${ERP_SECRETS_KEY}"
          if [ -n "${ENV_PLATFORM_ADMIN_PASSWORD:-}" ]; then echo "::add-mask::${ENV_PLATFORM_ADMIN_PASSWORD}"; fi
          REMOTE="$DUSER@$HOST"

          q() { printf '%q' "$1"; }
          REMOTE_ENV="JWT_SECRET=$(q "$JWT_SECRET")"
          REMOTE_ENV="$REMOTE_ENV ERP_SECRETS_KEY=$(q "$ERP_SECRETS_KEY")"
          REMOTE_ENV="$REMOTE_ENV ERP_BASE_DOMAIN=$(q "${ENV_ERP_BASE_DOMAIN:-}")"
          REMOTE_ENV="$REMOTE_ENV PLATFORM_ADMIN_EMAIL=$(q "${ENV_PLATFORM_ADMIN_EMAIL:-}")"
          REMOTE_ENV="$REMOTE_ENV PLATFORM_ADMIN_PASSWORD=$(q "${ENV_PLATFORM_ADMIN_PASSWORD:-}")"

          case "$HOST" in
            *.*) : ;;
            *) echo "ERROR: the host secret is not an IP address or domain (its length is ${#HOST} characters). Set the secret SSH_HOST to the server IP only, for example 169.58.191.84. SSH_HOST is used before ACCESSKEY, so a wrong ACCESSKEY value no longer matters."; exit 1 ;;
          esac

          echo "==> Testing SSH login to $HOST:$PORT as $DUSER"
          if ! sshpass -e $SSH -p "$PORT" "$REMOTE" "echo connected"; then
            echo "ERROR: SSH login failed. Check the password secret (SECRETKEY / SSH_PASSWORD) and SSH_USER."
            exit 1
          fi

          echo "==> Bootstrapping server ($HOST)"
          sshpass -e $SSH -p "$PORT" "$REMOTE" \
            "$REMOTE_ENV bash -s" \
            -- "$APP_DIR" "$SERVICE" "$DOMAIN" < .github/scripts/remote-bootstrap.sh

          # what is running: shown in the platform console (System > Releases); never typed by hand
          printf '{"commit":"%s","ref":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > agentify-erp/server/release.json

          echo "==> Backing up data and the current release"
          sshpass -e $SSH -p "$PORT" "$REMOTE" "bash -s" -- "$APP_DIR" < .github/scripts/remote-snapshot.sh

          echo "==> Uploading server code"
          sshpass -e rsync -az --delete -e "$SSH -p $PORT" \
            --exclude 'node_modules' --exclude '.env' --exclude '.env.*' \
            --exclude 'data' --exclude 'uploads' \
            agentify-erp/server/ "$REMOTE:$APP_DIR/server/"

          echo "==> Uploading shared"
          sshpass -e rsync -az --delete -e "$SSH -p $PORT" \
            agentify-erp/shared/ "$REMOTE:$APP_DIR/shared/"

          echo "==> Uploading built client"
          sshpass -e rsync -az --delete -e "$SSH -p $PORT" \
            agentify-erp/client/dist/ "$REMOTE:$APP_DIR/client/dist/"

          echo "==> Installing and restarting"
          sshpass -e $SSH -p "$PORT" "$REMOTE" "bash -s" \
            -- "$APP_DIR" "$SERVICE" < .github/scripts/remote-release.sh

          echo "Deployed: https://$DOMAIN (and http://$HOST:4000)"
          for u in "https://$DOMAIN/health" "http://$DOMAIN/health" "http://$HOST:4000/health"; do
            if curl -fsS -m 15 "$u" >/dev/null 2>&1; then echo "public check ok: $u"; break; else echo "public check not reachable yet: $u"; fi
          done
